<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo Hunter: Sonar Maze</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: monospace;
      color: #ddd;
    }
    canvas {
      display: block;
      background: #000;
    }
    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(255,255,255,0.25);
      font-size: 13px;
      line-height: 1.4;
    }
    .bar {
      width: 240px;
      height: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 6px;
      position: relative;
    }
    .fill {
      height: 100%;
      width: 100%;
    }
    #coreFill { background: linear-gradient(90deg, #4de0ff, #2b6fff); }
    #pfcFill  { background: linear-gradient(90deg, #ff58e3, #a04dff); }
    #message {
      margin-top: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
    }
    #hint {
      margin-top: 6px;
      color: #aaa;
      max-width: 700px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div>CORE ENERGY (Sprint)</div>
    <div class="bar"><div id="coreFill" class="fill"></div></div>
    <div>PFC ENERGY (Sonar)</div>
    <div class="bar"><div id="pfcFill" class="fill"></div></div>
    <div id="message"></div>
    <div id="hint">
      WASD move • Hold SHIFT sprint • Mouse aim • Q = Blue high-frequency pulse (20%) • E = Red long resonance (10%) • R = restart
    </div>
  </div>

  <script>
    // =========================
    // Canvas setup
    // =========================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    addEventListener("resize", resize);
    resize();

    const coreFill = document.getElementById("coreFill");
    const pfcFill = document.getElementById("pfcFill");
    const messageEl = document.getElementById("message");

    // =========================
    // Input
    // =========================
    const keys = {};
    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
      if ((e.key === "q" || e.key === "Q") && !e.repeat) firePulse("Q");
      if ((e.key === "e" || e.key === "E") && !e.repeat) firePulse("E");
      if ((e.key === "r" || e.key === "R") && !e.repeat) initGame();
    });
    addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);
    addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // =========================
    // Game state
    // =========================
    const tile = 24;
    const cols = 25;
    const rows = 25;
    let map = [];
    let mapW = cols * 2 + 1;
    let mapH = rows * 2 + 1;

    let player, monster, door;
    let particles = [];
    let glowDots = [];
    let noiseRipples = [];
    let gameState = "playing"; // playing | won | lost
    let lastCrashTime = 0;
    let lastTime = performance.now();

    function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

    // =========================
    // Maze generation (recursive backtracker)
    // =========================
    function generateMaze() {
      mapW = cols * 2 + 1;
      mapH = rows * 2 + 1;
      map = Array.from({ length: mapH }, () => Array(mapW).fill(1));

      const visited = Array.from({ length: rows }, () => Array(cols).fill(false));
      const sx = Math.floor(cols / 2);
      const sy = Math.floor(rows / 2);
      const stack = [{ x: sx, y: sy }];
      visited[sy][sx] = true;
      map[sy * 2 + 1][sx * 2 + 1] = 0;

      const dirs = [
        [1, 0], [-1, 0], [0, 1], [0, -1]
      ];

      while (stack.length) {
        const cur = stack[stack.length - 1];
        const shuffled = dirs.slice().sort(() => Math.random() - 0.5);
        let moved = false;
        for (const [dx, dy] of shuffled) {
          const nx = cur.x + dx, ny = cur.y + dy;
          if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
          if (visited[ny][nx]) continue;

          visited[ny][nx] = true;
          map[ny * 2 + 1][nx * 2 + 1] = 0;
          map[cur.y * 2 + 1 + dy][cur.x * 2 + 1 + dx] = 0; // knock wall
          stack.push({ x: nx, y: ny });
          moved = true;
          break;
        }
        if (!moved) stack.pop();
      }

      // Pick perimeter door
      const side = randInt(0, 3); // 0 top,1 bottom,2 left,3 right
      const candidates = [];
      if (side === 0) {
        for (let x = 1; x < mapW - 1; x += 2) if (map[1][x] === 0) candidates.push({ x, y: 0 });
      } else if (side === 1) {
        for (let x = 1; x < mapW - 1; x += 2) if (map[mapH - 2][x] === 0) candidates.push({ x, y: mapH - 1 });
      } else if (side === 2) {
        for (let y = 1; y < mapH - 1; y += 2) if (map[y][1] === 0) candidates.push({ x: 0, y });
      } else {
        for (let y = 1; y < mapH - 1; y += 2) if (map[y][mapW - 2] === 0) candidates.push({ x: mapW - 1, y });
      }
      door = candidates[Math.floor(Math.random() * candidates.length)];
      map[door.y][door.x] = 2;

      const playerStart = { mx: sx * 2 + 1, my: sy * 2 + 1 };

      // Monster spawn in random passage far from player
      let spawn = null;
      for (let i = 0; i < 5000; i++) {
        const mx = randInt(1, mapW - 2);
        const my = randInt(1, mapH - 2);
        if (map[my][mx] !== 0) continue;
        if (Math.abs(mx - playerStart.mx) + Math.abs(my - playerStart.my) < 28) continue;
        spawn = { mx, my };
        break;
      }
      if (!spawn) spawn = { mx: 1, my: 1 };

      return { playerStart, monsterStart: spawn };
    }

    function toWorld(mx, my) {
      return { x: (mx + 0.5) * tile, y: (my + 0.5) * tile };
    }

    function worldToMap(x, y) {
      return { mx: Math.floor(x / tile), my: Math.floor(y / tile) };
    }

    // =========================
    // Collision
    // =========================
    function isSolidTile(mx, my) {
      if (my < 0 || mx < 0 || my >= mapH || mx >= mapW) return true;
      return map[my][mx] === 1;
    }

    function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
      const nx = clamp(cx, rx, rx + rw);
      const ny = clamp(cy, ry, ry + rh);
      return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
    }

    function collidesWall(x, y, r) {
      const minX = Math.floor((x - r) / tile);
      const maxX = Math.floor((x + r) / tile);
      const minY = Math.floor((y - r) / tile);
      const maxY = Math.floor((y + r) / tile);
      for (let my = minY; my <= maxY; my++) {
        for (let mx = minX; mx <= maxX; mx++) {
          if (!isSolidTile(mx, my)) continue;
          const rx = mx * tile, ry = my * tile;
          if (circleRectCollide(x, y, r, rx, ry, tile, tile)) return true;
        }
      }
      return false;
    }

    function tryMove(entity, dx, dy, radius) {
      let collided = false;
      let nx = entity.x + dx;
      if (!collidesWall(nx, entity.y, radius)) entity.x = nx;
      else collided = true;

      let ny = entity.y + dy;
      if (!collidesWall(entity.x, ny, radius)) entity.y = ny;
      else collided = true;

      return collided;
    }

    // =========================
    // Pathfinding (BFS over map)
    // =========================
    function bfsPath(startMx, startMy, endMx, endMy) {
      const q = [{ x: startMx, y: startMy }];
      const visited = Array.from({ length: mapH }, () => Array(mapW).fill(false));
      const parent = Array.from({ length: mapH }, () => Array(mapW).fill(null));
      visited[startMy][startMx] = true;
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

      while (q.length) {
        const n = q.shift();
        if (n.x === endMx && n.y === endMy) break;
        for (const [dx,dy] of dirs) {
          const nx = n.x + dx, ny = n.y + dy;
          if (nx < 0 || ny < 0 || nx >= mapW || ny >= mapH) continue;
          if (visited[ny][nx]) continue;
          if (map[ny][nx] === 1) continue;
          visited[ny][nx] = true;
          parent[ny][nx] = n;
          q.push({ x: nx, y: ny });
        }
      }

      if (!visited[endMy][endMx]) return [];
      const path = [];
      let cur = { x: endMx, y: endMy };
      while (cur) {
        path.push(cur);
        cur = parent[cur.y][cur.x];
      }
      path.reverse();
      return path;
    }

    // =========================
    // Sonar, noise, monster
    // =========================
    function wakeMonster() {
      if (!monster.awake) {
        monster.awake = true;
        monster.path = [];
        monster.pathIdx = 0;
        monster.pathRecalcTimer = 0;
      }
    }

    function firePulse(type) {
      if (gameState !== "playing") return;
      const isQ = type === "Q";
      const cost = isQ ? 20 : 10;
      if (player.pfc < cost) return;
      player.pfc -= cost;

      const speed = isQ ? 6.5 : 3.5;
      const life = isQ ? 40 : 130;
      const color = isQ ? "80,170,255" : "255,70,70";
      const spread = isQ ? 0.16 : 0.30;
      const count = isQ ? 24 : 28;

      const aim = Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);

      for (let i = 0; i < count; i++) {
        const a = aim + (Math.random() * 2 - 1) * spread;
        particles.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          life,
          color,
          type
        });
      }
    }

    function spawnCrashRipple(x, y) {
      noiseRipples.push({ x, y, r: 2, speed: 4.5, max: 350, alive: true });
    }

    // =========================
    // Init
    // =========================
    function initGame() {
      const { playerStart, monsterStart } = generateMaze();
      const p = toWorld(playerStart.mx, playerStart.my);
      const m = toWorld(monsterStart.mx, monsterStart.my);
      player = {
        x: p.x,
        y: p.y,
        r: 6,
        speed: 1.9,
        sprintSpeed: 3.1,
        core: 100,
        pfc: 100
      };
      monster = {
        x: m.x,
        y: m.y,
        r: 9,
        awake: false,
        speed: 1.65,
        revealTimer: 0,
        path: [],
        pathIdx: 0,
        pathRecalcTimer: 0
      };
      particles = [];
      glowDots = [];
      noiseRipples = [];
      gameState = "playing";
      messageEl.textContent = "";
    }

    // =========================
    // Update
    // =========================
    function update(dt) {
      if (gameState !== "playing") return;

      // --- Player move ---
      let mx = 0, my = 0;
      if (keys["w"]) my -= 1;
      if (keys["s"]) my += 1;
      if (keys["a"]) mx -= 1;
      if (keys["d"]) mx += 1;
      const moving = mx !== 0 || my !== 0;
      if (moving) {
        const len = Math.hypot(mx, my);
        mx /= len; my /= len;
      }

      const sprinting = keys["shift"] && player.core > 0 && moving;
      const speed = sprinting ? player.sprintSpeed : player.speed;
      const collided = tryMove(player, mx * speed * dt * 60, my * speed * dt * 60, player.r);

      // Core energy: drains while moving, 2x when sprint
      if (moving) {
        const drain = sprinting ? 12 : 6;
        player.core = clamp(player.core - drain * dt, 0, 100);
      } else {
        player.core = clamp(player.core + 10 * dt, 0, 100);
      }

      // PFC regen
      player.pfc = clamp(player.pfc + 12 * dt, 0, 100);

      // Wall crash -> noise ripple
      const now = performance.now();
      if (collided && now - lastCrashTime > 220) {
        lastCrashTime = now;
        spawnCrashRipple(player.x, player.y);
      }

      // --- Noise ripples update ---
      for (let i = noiseRipples.length - 1; i >= 0; i--) {
        const nr = noiseRipples[i];
        nr.r += nr.speed * dt * 60;
        if (nr.r > nr.max) noiseRipples.splice(i, 1);

        // Wake monster if ripple touches
        if (!monster.awake) {
          if (dist(nr.x, nr.y, monster.x, monster.y) <= nr.r + monster.r) {
            wakeMonster();
            monster.revealTimer = Math.max(monster.revealTimer, 90);
          }
        }
      }

      // --- Sonar particles ---
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life--;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;

        // Monster intercept touch
        if (dist(p.x, p.y, monster.x, monster.y) <= monster.r + 2) {
          wakeMonster();
          monster.revealTimer = Math.max(monster.revealTimer, 90);
          particles.splice(i, 1);
          continue;
        }

        // Wall hit -> glowing dot
        if (collidesWall(p.x, p.y, 1.5)) {
          glowDots.push({
            x: p.x,
            y: p.y,
            a: 1.0,
            color: p.type === "Q" ? "120,190,255" : "255,70,70"
          });
          particles.splice(i, 1);
          continue;
        }

        if (p.life <= 0) particles.splice(i, 1);
      }

      // --- Glow decay ---
      for (let i = glowDots.length - 1; i >= 0; i--) {
        glowDots[i].a *= 0.9965; // ~0.35% fade/frame
        if (glowDots[i].a < 0.02) glowDots.splice(i, 1);
      }

      // --- Monster pursuit ---
      if (monster.awake) {
        monster.pathRecalcTimer -= dt;
        const mc = worldToMap(monster.x, monster.y);
        const pc = worldToMap(player.x, player.y);

        if (monster.pathRecalcTimer <= 0) {
          monster.path = bfsPath(mc.mx, mc.my, pc.mx, pc.my);
          monster.pathIdx = Math.min(1, Math.max(0, monster.path.length - 1));
          monster.pathRecalcTimer = 0.35;
        }

        if (monster.path && monster.path.length > 1) {
          const idx = clamp(monster.pathIdx, 1, monster.path.length - 1);
          const wpCell = monster.path[idx];
          const wp = toWorld(wpCell.x, wpCell.y);
          const dx = wp.x - monster.x;
          const dy = wp.y - monster.y;
          const d = Math.hypot(dx, dy);

          if (d < 4) {
            monster.pathIdx = clamp(monster.pathIdx + 1, 1, monster.path.length - 1);
          } else {
            const vx = (dx / d) * monster.speed * dt * 60;
            const vy = (dy / d) * monster.speed * dt * 60;
            tryMove(monster, vx, vy, monster.r);
          }
        }

        if (dist(player.x, player.y, monster.x, monster.y) < player.r + monster.r) {
          gameState = "lost";
          messageEl.textContent = "CAPTURED BY THE ECHO HUNTER — Press R to restart";
        }
      }

      // Reveal timer decay
      if (monster.revealTimer > 0) monster.revealTimer--;

      // --- Win check ---
      const pc = worldToMap(player.x, player.y);
      if (pc.mx === door.x && pc.my === door.y) {
        gameState = "won";
        messageEl.textContent = "ESCAPED THE MAZE — Press R to play again";
      }

      // HUD bars
      coreFill.style.width = `${player.core}%`;
      pfcFill.style.width = `${player.pfc}%`;
    }

    // =========================
    // Draw
    // =========================
    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const camX = player.x - canvas.width / 2;
      const camY = player.y - canvas.height / 2;
      const sx = (x) => x - camX;
      const sy = (y) => y - camY;

      // Door (subtle cyan slit on perimeter)
      const doorWorld = toWorld(door.x, door.y);
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = "#66ffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx(doorWorld.x), sy(doorWorld.y), 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Glow dots from sonar impacts
      for (const g of glowDots) {
        ctx.fillStyle = `rgba(${g.color},${g.a})`;
        ctx.beginPath();
        ctx.arc(sx(g.x), sy(g.y), 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Sonar particles
      for (const p of particles) {
        const alpha = Math.max(0, p.life / (p.type === "Q" ? 40 : 130));
        ctx.fillStyle = `rgba(${p.color},${0.85 * alpha})`;
        ctx.beginPath();
        ctx.arc(sx(p.x), sy(p.y), 2.1, 0, Math.PI * 2);
        ctx.fill();
      }

      // Noise ripples
      for (const n of noiseRipples) {
        ctx.strokeStyle = `rgba(255,220,60,${Math.max(0, 1 - n.r / n.max) * 0.9})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx(n.x), sy(n.y), n.r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Monster reveal (only when recently skimmed by sonar / wake event)
      if (monster.revealTimer > 0) {
        const flicker = 0.55 + Math.random() * 0.45;
        const t = performance.now() * 0.012;
        const pulseR = 12 + Math.sin(t) * 4;
        ctx.strokeStyle = `rgba(255,30,30,${flicker})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx(monster.x), sy(monster.y), pulseR, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = `rgba(255,40,40,${0.25 * flicker})`;
        ctx.beginPath();
        ctx.arc(sx(monster.x), sy(monster.y), 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Player radar pointer
      const aim = Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, canvas.height / 2);
      ctx.lineTo(
        canvas.width / 2 + Math.cos(aim) * 90,
        canvas.height / 2 + Math.sin(aim) * 90
      );
      ctx.stroke();

      // Player (white dot centered)
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, player.r, 0, Math.PI * 2);
      ctx.fill();

      // Center vignette glow
      const grd = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 0,
        canvas.width / 2, canvas.height / 2, 130
      );
      grd.addColorStop(0, "rgba(255,255,255,0.04)");
      grd.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // =========================
    // Main loop
    // =========================
    function loop(now) {
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    initGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
