<!DOCTYPE html>
<html lang="en">
<head>

  <title>Echo Hunter: Deepwater Contact</title>

    #pfcFill { background:linear-gradient(90deg,#73ffe2,#2bb9c2); box-shadow:0 0 8px #4debd7; }
    #msg { margin-top:7px; color:#e4fff8; font-weight:bold; font-size:15px; }
    #hint { color:#78b9b1; margin-top:7px; max-width:900px; }
    #contact { position:fixed; right:18px; top:16px; padding:8px 11px; border:1px solid rgba(112,244,220,.25); background:var(--panel); color:#73bdb3; letter-spacing:1px; font-size:10px; pointer-events:none; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div class="panel">
  <div class="label">BATTERY / SPRINT CAPACITOR</div><div class="bar"><div id="coreFill" class="fill"></div></div>
  <div class="label">PFC / ACTIVE SONAR CHARGE</div><div class="bar"><div id="pfcFill" class="fill"></div></div>
  <div id="msg"></div>
  <div id="hint">WASD move · SHIFT sprint · Mouse aim · Q narrow ping · E wide ping · R restart</div>
</div></div>
<div id="contact">HYDROPHONE ARRAY&nbsp; · &nbsp;CONTACTS: <span id="contactState">QUIET</span></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');

addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}function dist(x,y,a,b){return Math.hypot(x-a,y-b);}function angleDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}

function bfsPath(sx,sy,ex,ey,returnDistances=false){const q=[{x:sx,y:sy}],vis=Array.from({length:mapH},()=>Array(mapW).fill(false)),parent=Array.from({length:mapH},()=>Array(mapW).fill(null)),d=Array.from({length:mapH},()=>Array(mapW).fill(-1));if(sx<0||sy<0||sx>=mapW||sy>=mapH)return d;vis[sy][sx]=true;d[sy][sx]=0;const dirs=[[1,0],[-1,0],[0,1],[0,-1]];let head=0;while(head<q.length){const n=q[head++];if(n.x===ex&&n.y===ey)break;for(const[dx,dy]of dirs){const nx=n.x+dx,ny=n.y+dy;if(nx<0||ny<0||nx>=mapW||ny>=mapH||vis[ny][nx]||map[ny][nx]===1)continue;vis[ny][nx]=true;d[ny][nx]=d[n.y][n.x]+1;parent[ny][nx]=n;q.push({x:nx,y:ny});}}if(returnDistances)return d;if(ex<0||ey<0||!vis[ey][ex])return[];const path=[];let cur={x:ex,y:ey};while(cur){path.push(cur);cur=parent[cur.y][cur.x];}return path.reverse();}
