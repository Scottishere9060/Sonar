<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo Hunter: Cold War Radar Build</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Consolas, monospace;
      color: #9cff9c;
    }
    canvas { display: block; background: #000; }

    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(120,255,120,0.3);
      font-size: 13px;
      line-height: 1.4;
    }
    .bar {
      width: 270px;
      height: 10px;
      border: 1px solid rgba(120,255,120,0.4);
      background: rgba(120,255,120,0.08);
      margin-bottom: 7px;
    }
    .fill { height: 100%; width: 100%; }
    #coreFill { background: linear-gradient(90deg, #7dff7d, #2abf2a); }
    #pfcFill  { background: linear-gradient(90deg, #7de6ff, #2d6cff); }

    #msg {
      margin-top: 8px;
      font-weight: bold;
      font-size: 16px;
      color: #d4ffd4;
    }
    #hint {
      margin-top: 5px;
      color: #8ab88a;
      max-width: 980px;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div>CORE ENERGY (Sprint)</div>
  <div class="bar"><div id="coreFill" class="fill"></div></div>

  <div>PFC ENERGY (Sonar)</div>
  <div class="bar"><div id="pfcFill" class="fill"></div></div>

  <div id="msg"></div>
  <div id="hint">
    WASD move • Hold SHIFT sprint • Mouse aim • Q = Blue precision sector • E = Red wide resonance • R = Restart
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const coreFill = document.getElementById("coreFill");
const pfcFill = document.getElementById("pfcFill");
const msgEl = document.getElementById("msg");

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener("resize", resize); resize();

const keys = {};
let mouse = { x: canvas.width/2, y: canvas.height/2 };
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ((k === "q" || k === "e") && !e.repeat) fireSonar(k.toUpperCase());
  if (k === "r" && !e.repeat) initGame();
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });

function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx, ay-by); }
function angleDiff(a,b){
  let d = a - b;
  while (d > Math.PI) d -= Math.PI*2;
  while (d < -Math.PI) d += Math.PI*2;
  return d;
}

// ===== Maze (wider + forgiving) =====
const tile = 60;            // wider roads (increased)
const cols = 13, rows = 13;
let map = [];
let mapW = cols*2+1, mapH = rows*2+1;

let player, monster, door;
let sonarWaves = [];
let glowDots = [];
let noiseRipples = [];
let exitPulses = [];
let monsterPulses = [];     // new: monster sonar rings
let exitPulseTimer = 0;
let monsterPulseTimer = 0;

let gameState = "playing";
let lastCrash = 0;
let lastTime = performance.now();

// replay trails
let runTrail = [];
let monsterTrail = [];
let trailTimer = 0;
let monsterTrailTimer = 0;
let replayClock = 0;

function toWorld(mx,my){ return { x:(mx+0.5)*tile, y:(my+0.5)*tile }; }
function worldToMap(x,y){ return { mx:Math.floor(x/tile), my:Math.floor(y/tile) }; }

function generateMaze(){
  mapW = cols*2+1; mapH = rows*2+1;
  map = Array.from({length: mapH}, ()=>Array(mapW).fill(1));
  const visited = Array.from({length: rows}, ()=>Array(cols).fill(false));

  const sx = Math.floor(cols/2), sy = Math.floor(rows/2);
  const stack = [{x:sx,y:sy}];
  visited[sy][sx] = true;
  map[sy*2+1][sx*2+1] = 0;

  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  while(stack.length){
    const c = stack[stack.length-1];
    const shuffled = dirs.slice().sort(()=>Math.random()-0.5);
    let moved = false;
    for(const [dx,dy] of shuffled){
      const nx = c.x+dx, ny = c.y+dy;
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      if(visited[ny][nx]) continue;
      visited[ny][nx] = true;
      map[ny*2+1][nx*2+1] = 0;
      map[c.y*2+1+dy][c.x*2+1+dx] = 0;
      stack.push({x:nx,y:ny});
      moved = true;
      break;
    }
    if(!moved) stack.pop();
  }

  // forgiving loops
const extraBreaks = Math.floor(cols * rows * 0.62);
for(let i=0;i<extraBreaks;i++){
  if(Math.random() < 0.5){
    const x = randInt(2,mapW-3), y = randInt(1,mapH-2);
    if(x%2===0 && y%2===1 && map[y][x]===1 && map[y][x-1]===0 && map[y][x+1]===0) map[y][x]=0;
  } else {
    const x = randInt(1,mapW-2), y = randInt(2,mapH-3);
    if(x%2===1 && y%2===0 && map[y][x]===1 && map[y-1][x]===0 && map[y+1][x]===0) map[y][x]=0;
  }
}

// remove dead ends iteratively
for (let pass=0; pass<3; pass++){
  const deadEnds = [];
  for(let y=1; y<mapH-1; y+=2){
    for(let x=1; x<mapW-1; x+=2){
      if(map[y][x]!==0) continue;
      let open = 0;
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for(const [dx,dy] of dirs) if(map[y+dy][x+dx]===0) open++;
      if(open<=1) deadEnds.push({x,y});
    }
  }

  for(const d of deadEnds){
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-0.5);
    for(const [dx,dy] of dirs){
      const wx = d.x + dx, wy = d.y + dy;       // wall cell
      const nx = d.x + dx*2, ny = d.y + dy*2;   // next room cell
      if(nx<=0||ny<=0||nx>=mapW-1||ny>=mapH-1) continue;
      if(map[wy][wx]===1 && map[ny][nx]===0){ map[wy][wx]=0; break; }
    }
  }
}

// larger open pockets
for(let i=0;i<5;i++){
  const cx = randInt(3,mapW-4), cy = randInt(3,mapH-4);
  for(let y=-1;y<=1;y++){
    for(let x=-1;x<=1;x++){
      const xx=cx+x, yy=cy+y;
      if(xx<=0||yy<=0||xx>=mapW-1||yy>=mapH-1) continue;
      map[yy][xx] = 0;
    }
  }
}

// random player spawn in-map (not fixed center)
function randomOpenCell(minDoorDist=8){
  for(let i=0;i<5000;i++){
    const mx = randInt(1,mapW-2), my = randInt(1,mapH-2);
    if(map[my][mx]!==0) continue;
    const dd = Math.abs(mx-door.x)+Math.abs(my-door.y);
    if(dd < minDoorDist) continue;
    return {mx,my};
  }
  return {mx:1,my:1};
}

const ps = randomOpenCell(10);

// monster far from player
let ms = null;
for(let i=0;i<5000;i++){
  const mx=randInt(1,mapW-2), my=randInt(1,mapH-2);
  if(map[my][mx]!==0) continue;
  if(Math.abs(mx-ps.mx)+Math.abs(my-ps.my) < 18) continue;
  ms = {mx,my}; break;
}
if(!ms) ms={mx:mapW-2,my:mapH-2};

return {playerStart:ps, monsterStart:ms};
}

function isSolid(mx,my){
  if(mx<0||my<0||mx>=mapW||my>=mapH) return true;
  return map[my][mx]===1;
}
function circleRectCollide(cx,cy,r, rx,ry,rw,rh){
  const nx = clamp(cx,rx,rx+rw), ny = clamp(cy,ry,ry+rh);
  return (cx-nx)*(cx-nx)+(cy-ny)*(cy-ny) < r*r;
}
function collidesWall(x,y,r){
  const minX=Math.floor((x-r)/tile), maxX=Math.floor((x+r)/tile);
  const minY=Math.floor((y-r)/tile), maxY=Math.floor((y+r)/tile);
  for(let my=minY; my<=maxY; my++){
    for(let mx=minX; mx<=maxX; mx++){
      if(!isSolid(mx,my)) continue;
      if(circleRectCollide(x,y,r,mx*tile,my*tile,tile,tile)) return true;
    }
  }
  return false;
}
function tryMove(ent,dx,dy,r){
  let hit=false;
  const nx=ent.x+dx;
  if(!collidesWall(nx,ent.y,r)) ent.x=nx; else hit=true;
  const ny=ent.y+dy;
  if(!collidesWall(ent.x,ny,r)) ent.y=ny; else hit=true;
  return hit;
}

function bfsPath(sx,sy,ex,ey){
  const q=[{x:sx,y:sy}];
  const vis=Array.from({length:mapH},()=>Array(mapW).fill(false));
  const parent=Array.from({length:mapH},()=>Array(mapW).fill(null));
  vis[sy][sx]=true;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    const n=q.shift();
    if(n.x===ex&&n.y===ey) break;
    for(const [dx,dy] of dirs){
      const nx=n.x+dx, ny=n.y+dy;
      if(nx<0||ny<0||nx>=mapW||ny>=mapH) continue;
      if(vis[ny][nx]||map[ny][nx]===1) continue;
      vis[ny][nx]=true; parent[ny][nx]=n; q.push({x:nx,y:ny});
    }
  }
  if(!vis[ey][ex]) return [];
  const path=[]; let cur={x:ex,y:ey};
  while(cur){ path.push(cur); cur=parent[cur.y][cur.x]; }
  path.reverse(); return path;
}

// ===== Gameplay =====
function wakeMonster(){
  if(!monster.awake){
    monster.awake=true;
    monster.path=[]; monster.pathIdx=0; monster.recalc=0;
  }
}

function fireSonar(type){
  if(gameState!=="playing") return;
  const isQ = type==="Q";
  const cost = isQ ? 7 : 10; // blue cheaper
  if(player.pfc < cost) return;
  player.pfc -= cost;

  const aim = Math.atan2(mouse.y-canvas.height/2, mouse.x-canvas.width/2);
  sonarWaves.push({
    type, x:player.x, y:player.y, angle:aim,
    spread: isQ ? Math.PI/6.5 : Math.PI*0.8,
    r:2,
    speed: isQ ? 15 : 3.0,
    maxR: isQ ? 620 : 940,
    thickness: isQ ? 18 : 50,
    color: isQ ? [120,255,220] : [255,70,70] // cyan sonar
  });
}

function updateSonar(dt){
  for(let i=sonarWaves.length-1;i>=0;i--){
    const w=sonarWaves[i];
    w.r += w.speed*dt*60;
    if(w.r > w.maxR){ sonarWaves.splice(i,1); continue; }

    const dx=monster.x-w.x, dy=monster.y-w.y;
    const d=Math.hypot(dx,dy), a=Math.atan2(dy,dx);
    if(Math.abs(angleDiff(a,w.angle)) <= w.spread/2 &&
       d >= (w.r-w.thickness-monster.r) && d <= (w.r+monster.r+2)){
      wakeMonster();
      monster.revealTimer = Math.max(monster.revealTimer, 90);
    }

    const samples = w.type==="Q" ? 70 : 24;
    for(let s=0;s<=samples;s++){
      const t=-w.spread/2 + (s/samples)*w.spread;
      const px=w.x+Math.cos(w.angle+t)*w.r;
      const py=w.y+Math.sin(w.angle+t)*w.r;
      if(collidesWall(px,py,1.6)){
        if(Math.random() < (w.type==="Q" ? 0.97 : 0.28)){
          glowDots.push({
            x:px,y:py,a:1,size:w.type==="Q"?2.8:1.8,
            color:w.type==="Q"?"100,200,255":"255,90,90"
          });
        }
      }
    }
  }
}

function spawnCrashRipple(x,y){ noiseRipples.push({x,y,r:2,speed:5,max:430}); }

function spawnExitPulse(){
  const d = toWorld(door.x,door.y);
  exitPulses.push({x:d.x,y:d.y,r:2,speed:2.5,max:1200,alpha:0.62});
}
function updateExitPulses(dt){
  exitPulseTimer -= dt;
  if(exitPulseTimer <= 0){
    spawnExitPulse();
    exitPulseTimer = 4 + Math.random()*2.5;
  }
  for(let i=exitPulses.length-1;i>=0;i--){
    const p=exitPulses[i];
    p.r += p.speed*dt*60;
    if(p.r > p.max) exitPulses.splice(i,1);
  }
}

// Monster passive sonar pulses while moving
function spawnMonsterPulse(){
  monsterPulses.push({
    x: monster.x, y: monster.y,
    r: 2, speed: 1.35, max: 280, alpha: 0.26
  });
}
function updateMonsterPulses(dt, movingMonster){
  if(monster.awake && movingMonster){
    monsterPulseTimer -= dt;
    if(monsterPulseTimer <= 0){
      spawnMonsterPulse();
      monsterPulseTimer = 0.9; // slow pulse interval
    }
  }
  for(let i=monsterPulses.length-1;i>=0;i--){
    const p=monsterPulses[i];
    p.r += p.speed*dt*60;
    if(p.r > p.max) monsterPulses.splice(i,1);
  }
}

function initGame(){
  const g=generateMaze();
  const p=toWorld(g.playerStart.mx,g.playerStart.my);
  const m=toWorld(g.monsterStart.mx,g.monsterStart.my);

  player={x:p.x,y:p.y,r:7,speed:2.45,sprintSpeed:4.05,core:100,pfc:100};

  // Slower monster
  monster={x:m.x,y:m.y,r:18,awake:false,speed:1.62,path:[],pathIdx:0,recalc:0,revealTimer:0};

  sonarWaves=[]; glowDots=[]; noiseRipples=[]; exitPulses=[]; monsterPulses=[];
  exitPulseTimer=1.8;
  monsterPulseTimer=0.3;

  gameState="playing";
  msgEl.textContent="";

  runTrail=[]; monsterTrail=[]; trailTimer=0; monsterTrailTimer=0; replayClock=0;
}

function endRun(text){
  if(gameState!=="playing") return;
  gameState = text.includes("ESCAPED") ? "won" : "lost";
  msgEl.textContent = text + " — Press R";
  replayClock = 0;
}

function update(dt){
  if(gameState!=="playing"){
    replayClock += dt;
    return;
  }

  // player input
  let mx=0,my=0;
  if(keys["w"])my--; if(keys["s"])my++;
  if(keys["a"])mx--; if(keys["d"])mx++;
  const moving = mx!==0 || my!==0;
  if(moving){ const l=Math.hypot(mx,my); mx/=l; my/=l; }

  const sprinting = keys["shift"] && player.core>0 && moving;
  const speed = sprinting ? player.sprintSpeed : player.speed;
  const hit = tryMove(player,mx*speed*dt*60,my*speed*dt*60,player.r);

  if(moving) player.core = clamp(player.core - (sprinting?13:6.5)*dt,0,100);
  else player.core = clamp(player.core + 11*dt,0,100);
  player.pfc = clamp(player.pfc + 14*dt,0,100);

  const now=performance.now();
  if(hit && now-lastCrash>160){
    lastCrash=now;
    spawnCrashRipple(player.x,player.y);
  }

  for(let i=noiseRipples.length-1;i>=0;i--){
    const n=noiseRipples[i];
    n.r += n.speed*dt*60;
    if(n.r>n.max) noiseRipples.splice(i,1);
    if(!monster.awake && dist(n.x,n.y,monster.x,monster.y)<=n.r+monster.r){
      wakeMonster(); monster.revealTimer=Math.max(monster.revealTimer,85);
    }
  }

  updateSonar(dt);
  updateExitPulses(dt);

  for(let i=glowDots.length-1;i>=0;i--){
    glowDots[i].a *= 0.9965;
    if(glowDots[i].a < 0.02) glowDots.splice(i,1);
  }

  // monster chase
  let monsterMoved = false;
  if(monster.awake){
    monster.recalc -= dt;
    const mc=worldToMap(monster.x,monster.y), pc=worldToMap(player.x,player.y);
    if(monster.recalc<=0){
      monster.path = bfsPath(mc.mx,mc.my,pc.mx,pc.my);
      monster.pathIdx = Math.min(1,Math.max(0,monster.path.length-1));
      monster.recalc = 0.22;
    }
    if(monster.path.length>1){
      const idx=clamp(monster.pathIdx,1,monster.path.length-1);
      const wp=toWorld(monster.path[idx].x,monster.path[idx].y);
      const dx=wp.x-monster.x, dy=wp.y-monster.y;
      const d=Math.hypot(dx,dy);
      if(d<5) monster.pathIdx = clamp(monster.pathIdx+1,1,monster.path.length-1);
      else{
        const beforeX = monster.x, beforeY = monster.y;
        tryMove(monster,(dx/d)*monster.speed*dt*60,(dy/d)*monster.speed*dt*60,monster.r);
        monsterMoved = dist(beforeX,beforeY,monster.x,monster.y) > 0.2;
      }
    }

    if(dist(player.x,player.y,monster.x,monster.y)<player.r+monster.r+2){
      endRun("CAPTURED BY THE ECHO HUNTER");
    }
  }
  if(monster.revealTimer>0) monster.revealTimer--;

  updateMonsterPulses(dt, monsterMoved);

  const pm=worldToMap(player.x,player.y);
  if(pm.mx===door.x&&pm.my===door.y) endRun("ESCAPED");

  // trail recording
  trailTimer -= dt;
  if(trailTimer<=0){
    runTrail.push({x:player.x,y:player.y});
    trailTimer = 0.08;
  }
  if(monster.awake){
    monsterTrailTimer -= dt;
    if(monsterTrailTimer<=0){
      monsterTrail.push({x:monster.x,y:monster.y});
      monsterTrailTimer = 0.10;
    }
  }

  coreFill.style.width = player.core + "%";
  pfcFill.style.width = player.pfc + "%";
}

// ===== Draw =====
function drawSonarSector(w,camX,camY){
  const cx=w.x-camX, cy=w.y-camY;
  const a1=w.angle-w.spread/2, a2=w.angle+w.spread/2;
  const [r,g,b]=w.color;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  const layers = w.type==="Q" ? 3 : 6;
  for(let i=0;i<layers;i++){
    const rr=w.r-i*(w.thickness*0.5);
    if(rr<=2) continue;
    const th=w.thickness*(1-i*0.10);
    const alpha = Math.max(0.02,(w.type==="Q"?0.16:0.20)-i*(w.type==="Q"?0.05:0.025));
    ctx.beginPath();
    ctx.arc(cx,cy,rr,a1,a2);
    ctx.arc(cx,cy,Math.max(0,rr-th),a2,a1,true);
    ctx.closePath();
    ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
    ctx.fill();
  }
  ctx.strokeStyle=`rgba(${r},${g},${b},0.78)`;
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(cx,cy,w.r,a1,a2);
  ctx.stroke();
  ctx.restore();
}

function drawAmbientVision(camX,camY){
  const visionRadius = 110;
  const hardRadius = 70;
  const px=player.x, py=player.y;

  const minX=Math.max(0,Math.floor((px-visionRadius)/tile)-1);
  const maxX=Math.min(mapW-1,Math.floor((px+visionRadius)/tile)+1);
  const minY=Math.max(0,Math.floor((py-visionRadius)/tile)-1);
  const maxY=Math.min(mapH-1,Math.floor((py+visionRadius)/tile)+1);

  for(let y=minY;y<=maxY;y++){
    for(let x=minX;x<=maxX;x++){
      const tx=x*tile, ty=y*tile;
      const cx=tx+tile*0.5, cy=ty+tile*0.5;
      const d=dist(px,py,cx,cy);
      if(d>visionRadius) continue;
      if(map[y][x]===1){
        let a = d<hardRadius ? 0.18 : 0.18*(1-(d-hardRadius)/(visionRadius-hardRadius));
        a = clamp(a,0.03,0.18);
        ctx.fillStyle=`rgba(100,170,100,${a})`;
        ctx.fillRect(tx-camX,ty-camY,tile,tile);
        ctx.strokeStyle=`rgba(130,220,130,${a*0.8})`;
        ctx.strokeRect(tx-camX+0.5,ty-camY+0.5,tile-1,tile-1);
      }
    }
  }
}

function drawMiniReplay(){
  if(gameState==="playing") return;

  const w=220,h=220,pad=10;
  const x = canvas.width - w - 14;
  const y = 14;
  const worldW = mapW*tile, worldH = mapH*tile;
  const sx = (wx)=> x+pad + (wx/worldW)*(w-pad*2);
  const sy = (wy)=> y+pad + (wy/worldH)*(h-pad*2);

  ctx.save();
  ctx.fillStyle="rgba(5,20,5,0.88)";
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle="rgba(140,255,140,0.35)";
  ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
  ctx.fillStyle="rgba(150,255,150,0.9)";
  ctx.font="11px Consolas";
  ctx.fillText("COURSE REPLAY", x+10, y+14);

  ctx.fillStyle="rgba(70,120,70,0.45)";
  const miniW=w-pad*2, miniH=h-pad*2;
  const cw=miniW/mapW, ch=miniH/mapH;
  for(let my=0;my<mapH;my++){
    for(let mx=0;mx<mapW;mx++){
      if(map[my][mx]===1){
        ctx.fillRect(x+pad+mx*cw, y+pad+my*ch, cw, ch);
      }
    }
  }

  if(runTrail.length>1){
    ctx.beginPath();
    ctx.strokeStyle="rgba(120,220,255,0.30)";
    ctx.lineWidth=1.2;
    ctx.moveTo(sx(runTrail[0].x), sy(runTrail[0].y));
    for(let i=1;i<runTrail.length;i++) ctx.lineTo(sx(runTrail[i].x), sy(runTrail[i].y));
    ctx.stroke();
  }
  if(monsterTrail.length>1){
    ctx.beginPath();
    ctx.strokeStyle="rgba(255,90,90,0.30)";
    ctx.lineWidth=1.2;
    ctx.moveTo(sx(monsterTrail[0].x), sy(monsterTrail[0].y));
    for(let i=1;i<monsterTrail.length;i++) ctx.lineTo(sx(monsterTrail[i].x), sy(monsterTrail[i].y));
    ctx.stroke();
  }

  const pIdx = Math.min(runTrail.length-1, Math.floor(replayClock*12));
  if(pIdx>=0 && runTrail.length){
    ctx.fillStyle="rgba(120,220,255,0.95)";
    ctx.beginPath();
    ctx.arc(sx(runTrail[pIdx].x), sy(runTrail[pIdx].y), 2.8, 0, Math.PI*2);
    ctx.fill();
  }
  const mIdx = Math.min(monsterTrail.length-1, Math.floor(replayClock*12));
  if(mIdx>=0 && monsterTrail.length){
    ctx.fillStyle="rgba(255,90,90,0.95)";
    ctx.beginPath();
    ctx.arc(sx(monsterTrail[mIdx].x), sy(monsterTrail[mIdx].y), 2.8, 0, Math.PI*2);
    ctx.fill();
  }

  const d = toWorld(door.x,door.y);
  ctx.strokeStyle="rgba(120,255,200,0.9)";
  ctx.beginPath();
  ctx.arc(sx(d.x),sy(d.y),4,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function draw(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const camX = player.x - canvas.width/2;
  const camY = player.y - canvas.height/2;
  const sx=x=>x-camX, sy=y=>y-camY;

  drawAmbientVision(camX,camY);

  // Exit pulses
  for(const p of exitPulses){
    const a=Math.max(0,p.alpha*(1-p.r/p.max));
    ctx.strokeStyle=`rgba(100,255,220,${a})`;
    ctx.lineWidth=2.2;
    ctx.beginPath();
    ctx.arc(sx(p.x),sy(p.y),p.r,0,Math.PI*2);
    ctx.stroke();
  }

  // Strong constant exit glow (always lit)
  const ex = toWorld(door.x, door.y);
  const exs = sx(ex.x), eys = sy(ex.y);
  const g = ctx.createRadialGradient(exs, eys, 2, exs, eys, 70);
  g.addColorStop(0, "rgba(120,255,220,0.75)");
  g.addColorStop(0.45, "rgba(80,220,190,0.25)");
  g.addColorStop(1, "rgba(80,220,190,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(exs, eys, 70, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = "rgba(140,255,220,0.85)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(exs, eys, 10, 0, Math.PI*2);
  ctx.stroke();

  for(const gdot of glowDots){
    ctx.fillStyle=`rgba(${gdot.color},${gdot.a})`;
    ctx.beginPath();
    ctx.arc(sx(gdot.x),sy(gdot.y),gdot.size||2,0,Math.PI*2);
    ctx.fill();
  }

  for(const w of sonarWaves) drawSonarSector(w,camX,camY);

  for(const n of noiseRipples){
    ctx.strokeStyle=`rgba(255,220,90,${Math.max(0,1-n.r/n.max)*0.85})`;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(sx(n.x),sy(n.y),n.r,0,Math.PI*2);
    ctx.stroke();
  }

  // Monster moving sonar rings (visible presence)
  for(const p of monsterPulses){
    const a = Math.max(0, p.alpha*(1-p.r/p.max));
    ctx.strokeStyle = `rgba(255,80,80,${a})`;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), p.r, 0, Math.PI*2);
    ctx.stroke();
  }

  // Monster: faintly visible when awake + strong flicker on detection
  if(monster.awake){
    ctx.fillStyle = "rgba(255,70,70,0.18)";
    ctx.beginPath();
    ctx.arc(sx(monster.x), sy(monster.y), 9, 0, Math.PI*2);
    ctx.fill();
  }
  if(monster.revealTimer>0){
    const flick=0.45+Math.random()*0.55;
    const rr=22+Math.sin(performance.now()*0.015)*5;
    ctx.strokeStyle=`rgba(255,60,60,${flick})`;
    ctx.beginPath();
    ctx.arc(sx(monster.x),sy(monster.y),rr,0,Math.PI*2);
    ctx.stroke();
  }

  // Cold-war radar reticle + sweep
  const cx=canvas.width/2, cy=canvas.height/2;
  const aim=Math.atan2(mouse.y-cy,mouse.x-cx);
  const sweep = (performance.now()*0.0015)%(Math.PI*2);

  ctx.save();
  ctx.globalCompositeOperation="lighter";
  [30,55,82].forEach((r,i)=>{
    ctx.strokeStyle=`rgba(120,255,120,${0.14-i*0.03})`;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  });

  ctx.strokeStyle="rgba(120,255,120,0.22)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(sweep)*120, cy+Math.sin(sweep)*120);
  ctx.stroke();

  ctx.strokeStyle="rgba(180,255,200,0.55)";
  ctx.lineWidth=1.3;
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(aim)*110, cy+Math.sin(aim)*110);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle="rgba(180,255,180,0.95)";
  ctx.beginPath();
  ctx.arc(cx,cy,player.r,0,Math.PI*2);
  ctx.fill();

  // scanlines
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.strokeStyle = "#8fff8f";
  for(let y=0; y<canvas.height; y+=3){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }
  ctx.restore();

  drawMiniReplay();
}

function loop(now){
  const dt=Math.min(0.033,(now-lastTime)/1000);
  lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

initGame();
requestAnimationFrame(loop);
</script>
