<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SONAR: The Drowned Signal</title>
<style>
  :root {
    --bg: #040b13;
    --bg-2: #071d28;
    --ice: #9fffee;
    --ice-2: #75f4d1;
    --ice-3: #b7fff0;
    --cyan: #4ad9c8;
    --red: #ff3a5d;
    --red-2: #ff7c5d;
    --amber: #ffd77a;
    --panel: rgba(5, 18, 27, 0.82);
    --line: rgba(115,255,229,0.28);
    --line-strong: rgba(115,255,229,0.6);
    --text: #dffff8;
    --text-soft: #81b9b0;
  }
  * { box-sizing: border-box; }
  html,body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 36%, #071d28 0%, #040b13 40%, #01080d 100%);
    color: var(--text); font-family: Inter, ui-monospace, Consolas, monospace;
  }
  canvas {
    display: block; width: 100%; height: 100%; background: #030a13;
    filter: saturate(1.15) contrast(1.14);
  }
  #hud {
    position: fixed; inset: 18px; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .card {
    background: linear-gradient(135deg, rgba(8,29,39,.9), rgba(4,13,24,.82));
    border: 1px solid var(--line); box-shadow: 0 12px 42px rgba(0,0,0,.38), inset 0 0 24px rgba(72,244,208,.05);
    backdrop-filter: blur(8px); padding: 14px 16px; border-radius: 4px;
  }
  .brand {
    font-size: 11px; letter-spacing: 3px; color: #7ae0d3; text-transform: uppercase;
  }
  .title {
    font-size: 20px; letter-spacing: 2px; font-weight: 800; margin: 3px 0 14px; color: #ebfffa;
  }
  .stat {
    font-size: 10px; letter-spacing: 1.5px; color: #72a99f; margin-top: 8px; text-transform: uppercase;
  }
  .bar {
    height: 7px; width: 210px; background: rgba(12,36,41,.9); margin-top: 5px; border: 1px solid rgba(77,131,126,.8);
    box-shadow: inset 0 0 8px rgba(0,0,0,.35);
  }
  .fill {
    height: 100%; width: 100%; transition: width .15s linear; background: linear-gradient(90deg, #5af0d1, #bffff1);
    box-shadow: 0 0 12px rgba(65, 214, 190, 0.9);
  }
  .fill.red { background: linear-gradient(90deg, #ff3159, #ffb06e); box-shadow: 0 0 12px rgba(255,49,89,.9); }
  .objective {
    font-size: 13px; line-height: 1.55; max-width: 290px; color: #d7fff4;
  }
  .objective strong { color: #fff; }
  .tag {
    display: inline-block; padding: 4px 7px; border: 1px solid rgba(77,226,198,.6); color: #9bfce8;
    letter-spacing: 1.5px; font-size: 9px; text-transform: uppercase; margin-bottom: 8px;
    background: rgba(12,35,31,.45);
  }
  .controls {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); white-space: nowrap; color: #82afa8;
    font-size: 10px; letter-spacing: .6px; background: rgba(6,19,29,.9); border: 1px solid rgba(86,205,188,.2);
    padding: 9px 14px; pointer-events: none; border-radius: 2px;
  }
  .key {
    color: #dbfff5; border: 1px solid rgba(91,169,155,.9); padding: 2px 5px; margin: 0 2px; border-radius: 2px; background: rgba(11,30,29,.4);
  }
  .toast {
    position: fixed; left: 50%; top: 22%; transform: translate(-50%, -10px); opacity: 0; transition: .28s ease;
    background: rgba(7,25,35,.92); border: 1px solid rgba(112,255,224,.65); color: #defef6; padding: 12px 20px; letter-spacing: 1px;
    font-size: 12px; pointer-events: none; box-shadow: 0 0 18px rgba(73,214,180,.18);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(3, 19, 29, 0.76), rgba(2, 7, 12, 0.88));
    text-align: center; pointer-events: none; opacity: 0; transition: .4s ease; z-index: 10;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    max-width: 540px; padding: 34px; background: rgba(6,23,34,.88); border: 1px solid rgba(106,255,219,.38);
    box-shadow: 0 0 90px rgba(44,227,196,.22); border-radius: 6px;
  }
  .modal h1 {
    font-size: clamp(28px, 6vw, 54px); letter-spacing: 5px; margin: 6px 0; color: #ebfffa; text-transform: uppercase;
  }
  .modal p { color: #8fbab3; line-height: 1.7; font-size: 13px; }
  .modal button {
    font: inherit; letter-spacing: 2px; color: #04130f; background: #84ffe1; border: 0; padding: 13px 22px; cursor: pointer;
    font-weight: bold; margin-top: 10px; border-radius: 3px; transition: .2s ease; pointer-events: auto;
  }
  .modal button:hover { background: #fff; }
  @media (max-width: 650px) {
    #hud { inset: 10px; flex-direction: column; }
    .card { padding: 10px 12px; }
    .objective { max-width: 250px; }
    .bar { width: 170px; }
    .controls { bottom: 8px; font-size: 8px; }
    .right { display: none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="card">
    <div class="brand">Abyssal Survey // 09</div>
    <div class="title">SONAR</div>
    <div class="stat">Suit Integrity</div>
    <div class="bar"><div id="health" class="fill"></div></div>
    <div class="stat">Sonar Charge</div>
    <div class="bar"><div id="charge" class="fill"></div></div>
  </div>
  <div class="card right">
    <div id="levelTag" class="tag">LEVEL 01</div>
    <div id="objective" class="objective"></div>
    <div id="threat" class="stat">Threat // Dormant</div>
  </div>
</div>
<div class="controls"><span class="key">WASD</span> Move &nbsp; <span class="key">SHIFT</span> Sprint &nbsp; <span class="key">SPACE</span> Ping &nbsp; <span class="key">F</span> Decoy &nbsp; <span class="key">E</span> Interact</div>
<div id="toast" class="toast"></div>
<div id="overlay" class="show">
  <div class="modal">
    <div class="brand">Abyssal Survey // 09</div>
    <h1>The Drowned Signal</h1>
    <p>Two dives. One way out. Your sonar reveals the maze—but every pulse tells the hunter where you are.</p>
    <button id="start">Begin Dive</button>
  </div>
</div>
<script>
const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
const healthUI = document.querySelector('#health');
const chargeUI = document.querySelector('#charge');
const objectiveUI = document.querySelector('#objective');
const levelUI = document.querySelector('#levelTag');
const threatUI = document.querySelector('#threat');
const toastUI = document.querySelector('#toast');
const overlay = document.querySelector('#overlay');

let W = 0, H = 0;
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
addEventListener('resize', resize);
resize();

const N = 17, T = 56, S = N * 2 + 1;
let grid, player, hunter, exit, sites = [], artifact, level = 1, charge = 100, integrity = 100, state = 'intro', waves = [], noise = [], decoys = [], reveals = [], last = 0, toastTimer = 0, keys = {}, mouse = { x: W / 2, y: H / 2 };

const rand = (a, b) => Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hyp = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function world(x, y) { return { x: (x + 0.5) * T, y: (y + 0.5) * T }; }
function cell(x, y) { return { x: Math.floor(x / T), y: Math.floor(y / T) }; }
function walk(x, y) { return x >= 0 && y >= 0 && x < S && y < S && grid[y][x] !== 1; }

function maze() {
  grid = Array.from({ length: S }, () => Array(S).fill(1));
  const stack = [{ x: 1, y: 1 }];
  grid[1][1] = 0;
  while (stack.length) {
    const c = stack[stack.length - 1];
    const opts = [[2,0],[-2,0],[0,2],[0,-2]].filter(([dx, dy]) => c.x + dx > 0 && c.y + dy > 0 && c.x + dx < S - 1 && c.y + dy < S - 1 && grid[c.y + dy][c.x + dx] === 1);
    if (!opts.length) { stack.pop(); continue; }
    const [dx, dy] = opts[rand(0, opts.length - 1)];
    grid[c.y + dy / 2][c.x + dx / 2] = 0;
    grid[c.y + dy][c.x + dx] = 0;
    stack.push({ x: c.x + dx, y: c.y + dy });
  }
  for (let i = 0; i < 40; i++) {
    const x = rand(1, S - 2), y = rand(1, S - 2);
    if (grid[y][x] === 1 && ((x % 2) !== (y % 2))) grid[y][x] = 0;
  }
}

function distances(start) {
  const d = Array.from({ length: S }, () => Array(S).fill(-1));
  const q = [start];
  d[start.y][start.x] = 0;
  for (let i = 0; i < q.length; i++) {
    const c = q[i];
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const x = c.x + dx, y = c.y + dy;
      if (walk(x, y) && d[y][x] < 0) {
        d[y][x] = d[c.y][c.x] + 1;
        q.push({ x, y });
      }
    }
  }
  return d;
}

function farCell(d, min = 8, exclude = []) {
  const candidates = [];
  for (let y = 1; y < S - 1; y++) {
    for (let x = 1; x < S - 1; x++) {
      if (walk(x, y) && d[y][x] >= min && !exclude.some(c => c.x === x && c.y === y)) {
        candidates.push({ x, y });
      }
    }
  }
  return candidates.length ? candidates[rand(0, candidates.length - 1)] : { x: 1, y: 1 };
}

function initLevel(n) {
  level = n; maze();
  const start = { x: 1, y: 1 };
  const d = distances(start);
  player = { ...world(start.x, start.y), r: 10, vx: 0, vy: 0 };
  exit = farCell(d, 22);
  sites = [];
  artifact = null;
  waves = []; noise = []; decoys = []; reveals = [];
  charge = 100; integrity = 100;

  if (level === 1) {
    for (let i = 0; i < 4; i++) {
      const c = farCell(d, 10, [exit, ...sites]);
      sites.push({ x: c.x, y: c.y, dug: false });
    }
    hunter = null;
  } else {
    artifact = farCell(d, 20, [exit]);
    hunter = { x: exit.x * T + T / 2, y: exit.y * T + T / 2, r: 16, speed: 88, target: { x: player.x, y: player.y }, awake: false, stun: 0, path: [], repath: 0 };
  }

  updateUI();
  say(level === 1 ? 'Level 1 // Excavate the signal cache' : 'Level 2 // Retrieve the core, then run');
  state = 'playing';
}

function updateUI() {
  levelUI.textContent = `LEVEL ${String(level).padStart(2, '0')}`;
  objectiveUI.innerHTML = level === 1
    ? `Excavation<br><strong>${sites.filter(s => s.dug).length} / ${sites.length}</strong> deposits recovered<br>Then reach the marked hatch.`
    : artifact
      ? `Recovery<br>Take the <strong>black-box core</strong>.<br>Then reach the hatch before the hunter closes in.`
      : `Escape<br><strong>Core secured.</strong><br>Get to the exit.`;
  healthUI.style.width = integrity + '%';
  chargeUI.style.width = charge + '%';
  threatUI.textContent = level === 1 ? 'Threat // Dormant' : (hunter && hunter.awake ? 'Threat // Hunter Active' : 'Threat // Dormant');
}

function say(text) {
  toastUI.textContent = text;
  toastUI.classList.add('show');
  toastTimer = 2.2;
}

function ping(decoy = false) {
  if (state !== 'playing' || charge < (decoy ? 28 : 12)) return;
  charge -= decoy ? 28 : 12;
  const dir = Math.atan2(mouse.y - H / 2, mouse.x - W / 2);
  const p = decoy ? { x: player.x + Math.cos(dir) * 135, y: player.y + Math.sin(dir) * 135 } : { x: player.x, y: player.y };
  const red = !decoy && hunter && hunter.awake;
  waves.push({ x: p.x, y: p.y, r: 4, max: decoy ? 470 : 650, speed: decoy ? 300 : 390, red });
  reveals.push({ x: p.x, y: p.y, r: decoy ? 470 : 650, t: 3.2, red });
  noise.push({ x: p.x, y: p.y, r: 0, max: decoy ? 620 : 850, speed: 260, heard: false });

  if (decoy) {
    decoys.push({ x: p.x, y: p.y, t: 3 });
    if (hunter && hunter.awake) {
      hunter.target = { x: p.x, y: p.y };
      hunter.repath = 0;
    }
    say('Decoy Ping // Hunter Diverted');
  } else if (red) {
    say('Red Sonar // Hostile Contact');
  } else {
    say('Active Sonar // Sweeping');
  }
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (!e.repeat && k === ' ') { mouse.x = W / 2; mouse.y = H / 2; ping(); }
  if (!e.repeat && k === 'f') ping(true);
  if (!e.repeat && k === 'e') interact();
  if (!e.repeat && k === 'r' && state !== 'intro') initLevel(level);
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

document.querySelector('#start').onclick = () => {
  overlay.classList.remove('show');
  initLevel(1);
};

function interact() {
  if (state !== 'playing') return;

  if (level === 1) {
    const s = sites.find(site => !site.dug && hyp(player, world(site.x, site.y)) < T * 0.95);
    if (s) {
      s.dug = true;
      updateUI();
      say(`Deposit Excavated // ${sites.filter(x => x.dug).length} of ${sites.length}`);
      return;
    }
    if (sites.every(site => site.dug) && hyp(player, world(exit.x, exit.y)) < T) {
      finishLevel();
      return;
    }
    say('Move closer to a deposit or hatch');
  } else {
    if (artifact && hyp(player, world(artifact.x, artifact.y)) < T) {
      artifact = null;
      hunter.awake = true;
      hunter.target = { x: player.x, y: player.y };
      say('Core Secured // Hunter Active — Run!');
      updateUI();
      return;
    }
    if (!artifact && hyp(player, world(exit.x, exit.y)) < T) {
      finishLevel();
      return;
    }
    say(artifact ? 'Move closer to the core' : 'The hatch is nearby');
  }
}

function finishLevel() {
  if (level === 1) {
    state = 'between';
    overlay.classList.add('show');
    overlay.querySelector('.brand').textContent = 'Dive 01 Complete';
    overlay.querySelector('h1').textContent = 'Signals Recovered';
    overlay.querySelector('p').textContent = 'The excavation is complete. The next dive pulls the core from the deep and the hunter wakes.';
    overlay.querySelector('button').textContent = 'Descend to Dive 02';
    overlay.querySelector('button').onclick = () => {
      overlay.classList.remove('show');
      initLevel(2);
    };
  } else {
    state = 'won';
    overlay.classList.add('show');
    overlay.querySelector('.brand').textContent = 'Mission Complete';
    overlay.querySelector('h1').textContent = 'You Made It Out';
    overlay.querySelector('p').textContent = 'The black-box core is recovered. The abyss keeps the rest.';
    overlay.querySelector('button').textContent = 'Dive Again';
    overlay.querySelector('button').onclick = () => {
      overlay.classList.remove('show');
      initLevel(1);
    };
  }
}

function die() {
  state = 'lost';
  overlay.classList.add('show');
  overlay.querySelector('.brand').textContent = 'Signal Lost';
  overlay.querySelector('h1').textContent = 'Taken by the Deep';
  overlay.querySelector('p').textContent = 'The hunter found you. Use a decoy ping (F) to draw it away, then keep moving.';
  overlay.querySelector('button').textContent = 'Restart Dive';
  overlay.querySelector('button').onclick = () => {
    overlay.classList.remove('show');
    initLevel(level);
  };
}

function solid(x, y, r) {
  const l = Math.floor((x - r) / T), rr = Math.floor((x + r) / T), t = Math.floor((y - r) / T), b = Math.floor((y + r) / T);
  for (let cy = t; cy <= b; cy++) {
    for (let cx = l; cx <= rr; cx++) {
      if (!walk(cx, cy)) {
        const nx = clamp(x, cx * T, (cx + 1) * T);
        const ny = clamp(y, cy * T, (cy + 1) * T);
        if ((x - nx) ** 2 + (y - ny) ** 2 < r * r) return true;
      }
    }
  }
  return false;
}

function move(ent, dx, dy, r) {
  if (!solid(ent.x + dx, ent.y, r)) ent.x += dx;
  if (!solid(ent.x, ent.y + dy, r)) ent.y += dy;
}

function pathTo(from, to) {
  const a = cell(from.x, from.y);
  const b = cell(to.x, to.y);
  const d = Array.from({ length: S }, () => Array(S).fill(null));
  const q = [a];
  d[a.y][a.x] = a;

  for (let i = 0; i < q.length; i++) {
    const c = q[i];
    if (c.x === b.x && c.y === b.y) break;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const x = c.x + dx, y = c.y + dy;
      if (walk(x, y) && !d[y][x]) {
        d[y][x] = c;
        q.push({ x, y });
      }
    }
  }

  if (!d[b.y]?.[b.x]) return [];
  const out = [];
  let c = b;
  while (c.x !== a.x || c.y !== a.y) {
    out.push(c);
    c = d[c.y][c.x];
  }
  return out.reverse();
}

function update(dt) {
  if (state !== 'playing') return;

  let dx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
  let dy = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
  const moving = dx || dy;
  if (moving) {
    const l = Math.hypot(dx, dy) || 1;
    dx /= l; dy /= l;
  }

  const sprint = keys.shift && integrity > 1;
  const sp = sprint ? 190 : 122;
  move(player, dx * sp * dt, dy * sp * dt, player.r);
  player.vx = dx * sp; player.vy = dy * sp;

  integrity = clamp(integrity + (sprint ? -17 : moving ? -3 : 10) * dt, 0, 100);
  charge = clamp(charge + 17 * dt, 0, 100);
  if (integrity <= 0) { integrity = 0; die(); }

  if (level === 2 && hunter) {
    if (moving && sprint) noise.push({ x: player.x, y: player.y, r: 0, max: 500, speed: 240, heard: false });
    hunter.repath -= dt;
    if (hunter.repath <= 0) {
      hunter.path = pathTo(hunter, hunter.target || player);
      hunter.repath = 0.35;
    }
    if (hunter.awake && hunter.path.length) {
      const target = world(hunter.path[0].x, hunter.path[0].y);
      const vx = target.x - hunter.x;
      const vy = target.y - hunter.y;
      const len = Math.hypot(vx, vy) || 1;
      move(hunter, (vx / len) * hunter.speed * dt, (vy / len) * hunter.speed * dt, hunter.r);
      if (hyp(hunter, target) < 10) hunter.path.shift();
    }
    if (hunter.awake && hyp(player, hunter) < player.r + hunter.r + 2) die();
  }

  for (const w of waves) w.r += w.speed * dt;
  waves = waves.filter(w => w.r < w.max);

  for (const n of noise) {
    n.r += n.speed * dt;
    if (level === 2 && hunter && !n.heard && hyp(n, hunter) < n.r + T * 0.6) {
      n.heard = true;
      hunter.awake = true;
      hunter.target = { x: n.x, y: n.y };
      hunter.repath = 0;
    }
  }
  noise = noise.filter(n => n.r < n.max);

  for (const r of reveals) r.t -= dt;
  reveals = reveals.filter(r => r.t > 0);

  for (const d of decoys) d.t -= dt;
  decoys = decoys.filter(d => d.t > 0);

  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) toastUI.classList.remove('show');
  }

  if (level === 1 && sites.every(s => s.dug) && hyp(player, world(exit.x, exit.y)) < T * 1.4) {
    say('Hatch Open // Level Complete');
  }
  if (level === 2 && !artifact && hyp(player, world(exit.x, exit.y)) < T * 1.4) {
    say('Exit Clear // Run for the hatch');
  }

  updateUI();
}

function drawHunter(x, y, time) {
  ctx.save();
  ctx.translate(x, y);
  const pulse = 1 + Math.sin(time * 5) * 0.08;
  ctx.scale(pulse, pulse);
  ctx.shadowBlur = 26;
  ctx.shadowColor = 'rgba(255, 35, 70, 0.95)';
  ctx.fillStyle = '#220d1a';
  ctx.strokeStyle = '#ff405c';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let i = 0; i < 16; i++) {
    const a = i * Math.PI / 8;
    const r = i % 2 ? 18 : 28;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.shadowBlur = 18;
  ctx.fillStyle = '#ff415f';
  ctx.beginPath();
  ctx.ellipse(0, 0, 15, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff0ef';
  ctx.beginPath();
  ctx.ellipse(4, -2, 3.2, 2.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff2d52';
  ctx.beginPath();
  ctx.arc(4, -2, 1.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#ff7d7d';
  ctx.lineWidth = 1.5;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(-7, i * 4);
    ctx.lineTo(-20, i * 9);
    ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  const camX = player ? player.x - W / 2 : 0;
  const camY = player ? player.y - H / 2 : 0;

  // ambient background
  const bg = ctx.createRadialGradient(W * 0.5, H * 0.52, 40, W * 0.5, H * 0.52, Math.max(W, H) * 0.8);
  bg.addColorStop(0, 'rgba(13, 43, 55, 0.8)');
  bg.addColorStop(0.45, 'rgba(7, 20, 28, 0.72)');
  bg.addColorStop(1, 'rgba(2, 8, 12, 0.94)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (!player) return;

  ctx.save();
  ctx.translate(-camX, -camY);

  const left = Math.max(0, Math.floor(camX / T) - 1);
  const right = Math.min(S - 1, Math.ceil((camX + W) / T) + 1);
  const top = Math.max(0, Math.floor(camY / T) - 1);
  const bottom = Math.min(S - 1, Math.ceil((camY + H) / T) + 1);

  for (let y = top; y <= bottom; y++) {
    for (let x = left; x <= right; x++) {
      const px = x * T, py = y * T;
      if (grid[y][x] === 1) {
        ctx.fillStyle = '#0a1a25';
        ctx.fillRect(px, py, T, T);
        ctx.strokeStyle = '#142a34';
        ctx.strokeRect(px + 1, py + 1, T - 2, T - 2);
        ctx.fillStyle = '#10232d';
        ctx.fillRect(px + 5, py + 5, T - 10, 2);
      } else {
        ctx.fillStyle = '#07151e';
        ctx.fillRect(px, py, T, T);
        ctx.strokeStyle = '#0c222b';
        ctx.strokeRect(px, py, T, T);
      }
    }
  }

  const locus = ctx.createRadialGradient(player.x, player.y, 20, player.x, player.y, 210);
  locus.addColorStop(0, 'rgba(63, 215, 191, 0.12)');
  locus.addColorStop(1, 'rgba(1, 7, 14, 0.83)');
  ctx.fillStyle = locus;
  ctx.fillRect(camX, camY, W, H);

  for (const r of reveals) {
    const g = ctx.createRadialGradient(r.x, r.y, 12, r.x, r.y, r.r);
    g.addColorStop(0, r.red ? 'rgba(255, 75, 94, 0.16)' : 'rgba(44, 205, 188, 0.14)');
    g.addColorStop(1, 'rgba(22, 32, 42, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(r.x - r.r, r.y - r.r, r.r * 2, r.r * 2);
  }

  // exit ring
  const e = world(exit.x, exit.y);
  ctx.save();
  const pulse = 1 + Math.sin(performance.now() / 400) * 0.08;
  ctx.translate(e.x, e.y);
  ctx.scale(pulse, pulse);
  ctx.shadowBlur = 18;
  ctx.shadowColor = '#71ffe0';
  ctx.strokeStyle = '#8effe6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#d9fff5';
  ctx.fillRect(-5, -5, 10, 10);
  ctx.restore();

  // excavation sites
  for (const s of sites) {
    if (s.dug) continue;
    const p = world(s.x, s.y);
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#f3d39d';
    ctx.fillStyle = '#efc570';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(239, 197, 112, 0.65)';
    ctx.strokeRect(p.x - 12, p.y - 12, 24, 24);
  }

  // artifact
  if (artifact) {
    const p = world(artifact.x, artifact.y);
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#ff4964';
    ctx.fillStyle = '#ff5a6e';
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(performance.now() / 900);
    ctx.fillRect(-9, -9, 18, 18);
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  // sonar waves
  for (const w of waves) {
    for (let i = 0; i < 3; i++) {
      const radius = w.r + i * 18;
      ctx.strokeStyle = w.red ? `rgba(255, 48, 77, ${0.28 - i * 0.08})` : `rgba(115,255,229,${0.42 - i * 0.12})`;
      ctx.lineWidth = w.red ? 2.5 : 1.7;
      ctx.beginPath();
      ctx.arc(w.x, w.y, radius, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // decoy pulses
  for (const d of decoys) {
    ctx.strokeStyle = `rgba(116,255,224,${d.t / 3})`;
    ctx.beginPath();
    ctx.arc(d.x, d.y, 14, 0, Math.PI * 2);
    ctx.stroke();
  }

  // hunter
  if (hunter && hunter.awake) {
    drawHunter(hunter.x, hunter.y, performance.now() / 1000);
    if (Math.floor(performance.now() / 850) % 2 === 0) {
      ctx.strokeStyle = 'rgba(255, 55, 78, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(hunter.x, hunter.y, 34, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // player
  ctx.save();
  ctx.shadowBlur = 18; ctx.shadowColor = '#80ffe1';
  ctx.fillStyle = '#d5fff3';
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#43dcca';
  ctx.beginPath(); ctx.arc(player.x + 3, player.y - 2, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.restore();

  // center scope frame
  ctx.strokeStyle = 'rgba(92,221,199,.09)';
  ctx.lineWidth = 1;
  for (let r = 125; r < Math.max(W, H); r += 125) {
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(122,224,210,.48)';
  ctx.font = '10px monospace';
  ctx.fillText('Acoustic Mapping // ' + (hunter && hunter.awake ? 'Hostile Contact' : 'Passive Sweep'), W / 2 - 105, H - 34);

  ctx.strokeStyle = 'rgba(98,231,207,.25)';
  ctx.beginPath();
  ctx.moveTo(W / 2 - 12, H / 2); ctx.lineTo(W / 2 + 12, H / 2);
  ctx.moveTo(W / 2, H / 2 - 12); ctx.lineTo(W / 2, H / 2 + 12);
  ctx.stroke();
}

function frame(t) {
  const dt = Math.min(0.04, (t - last) / 1000 || 0);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
