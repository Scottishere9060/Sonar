<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聲波雷達迷宮：回聲獵手 (Acoustic Radar Maze)</title>
    <style>
        body {
            margin: 0;
            background-color: #030305;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.15);
            border: 1px solid #004411;
        }
        #sonar-canvas {
            background-color: #050508;
            display: block;
            cursor: crosshair;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            line-height: 1.5;
            font-size: 14px;
            text-shadow: 0 0 5px #00ff66;
        }
        .hud-metric { margin-bottom: 8px; }
        #alert-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0055;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 8px #ff0055;
            display: none;
            letter-spacing: 2px;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 5, 8, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
        .start-btn {
            background: none;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            text-shadow: 0 0 8px #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            transition: all 0.2s ease;
        }
        .start-btn:hover {
            background-color: #00ff66;
            color: #030305;
            box-shadow: 0 0 25px #00ff66;
        }
        .controls-hint {
            color: #008833;
            font-size: 12px;
            margin-top: 20px;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Highest Level Intercept Cover Layer -->
    <div id="start-overlay">
        <button class="start-btn" onclick="initializeSonarEngine()">▶ 啟動聲納主機 (INITIALIZE ENGINE)</button>
        <div class="controls-hint">
            【操作說明表】<br>
            1. 滑鼠移動：控制雷達指針方向 ＆ 白色圓點前進推進<br>
            2. 鍵盤 【Q 鍵】：發射高頻藍色波（精準高消耗、範圍短）<br>
            3. 鍵盤 【E 鍵】：發射低頻紅色波（擴散極遠、易引來獵手）
        </div>
    </div>

    <div id="hud">
        <div class="hud-metric">📡 系統狀態: SONAR SYSTEM ACTIVE</div>
        <div class="hud-metric">🧭 雷達方位 (Radar Bearing): <span id="ui-angle">0°</span></div>
        <div class="hud-metric">🔋 PFC 認知能量核心: <span id="ui-energy">100%</span></div>
        <div class="hud-metric" style="color: #ffbe0b;">🧌 獵手威脅指數: <span id="ui-threat">SAFE</span></div>
        <div class="hud-metric" style="color: #00ff66; margin-top: 15px; font-weight: bold;">空間模型建立進度: <span id="val-progress">0%</span></div>
    </div>
    <div id="alert-box">⚠️ 警告：偵測到未知高顯性回聲源正在高速逼近 ⚠️</div>
    <canvas id="sonar-canvas" width="900" height="700"></canvas>
</div>

<script>
    const canvas = document.getElementById("sonar-canvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("start-overlay");
    
    const state = {
        pfc_energy: 100,
        monster_alert: false,
        gameOver: false,
        win: false,
        engineActive: false
    };

    const player = {
        x: 100,
        y: 100,
        radius: 6,
        angle: 0,
        speed: 1.8
    };

    const monster = {
        x: 800,
        y: 600,
        radius: 10,
        speed: 1.35,
        active: false
    };

    const escapePoint = { x: 820, y: 120, radius: 15 };

    const walls = [
        {x: 0, y: 0, w: 900, h: 20},
        {x: 0, y: 680, w: 900, h: 20},
        {x: 0, y: 0, w: 20, h: 700},
        {x: 880, y: 0, w: 20, h: 700},
        {x: 220, y: 20, w: 30, h: 420},
        {x: 220, y: 530, w: 30, h: 170},
        {x: 400, y: 180, w: 30, h: 520},
        {x: 580, y: 20, w: 30, h: 450},
        {x: 740, y: 250, w: 30, h: 450}
    ];

    let waves = [];
    let discoveredPoints = []; 

    let mouseX = player.x;
    let mouseY = player.y;

    // 點擊按鈕一鍵解鎖全域執行功能
    function initializeSonarEngine() {
        overlay.style.opacity = "0";
        setTimeout(() => {
            overlay.style.display = "none";
        }, 300);
        state.engineActive = true;
    }

    // 捕獲滑鼠移動坐標
    window.addEventListener("mousemove", (e) => {
        if (!state.engineActive) return;
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
    });

    // 🚀 全域最高優先級按鍵接管：徹底破除不互動 Bug
    document.addEventListener("keydown", (e) => {
        if (!state.engineActive || state.gameOver) return;
        
        const activeKey = e.key.toLowerCase();
        
        // Q 鍵脈衝
        if (activeKey === 'q' && state.pfc_energy >= 20) {
            state.pfc_energy -= 20;
            spawnWave("high");
        }
        // E 鍵共振
        if (activeKey === 'e' && state.pfc_energy >= 10) {
            state.pfc_energy -= 10;
            spawnWave("low");
        }
    });

    function spawnWave(type) {
        const numParticles = type === "high" ? 180 : 360;
        const speed = type === "high" ? 6.5 : 3.5;
        const maxLife = type === "high" ? 40 : 130;
        const color = type === "high" ? "rgba(0, 136, 255," : "rgba(255, 0, 110,";

        for (let i = 0; i < numParticles; i++) {
            const angle = (Math.PI * 2 / numParticles) * i;
            waves.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: maxLife,
                maxLife: maxLife,
                color: color,
                waveType: type
            });
        }
    }

    function checkCollision(circle, rect) {
        const distX = Math.abs(circle.x - rect.x - rect.w / 2);
        const distY = Math.abs(circle.y - rect.y - rect.h / 2);
        if (distX > (rect.w / 2 + circle.radius)) return false;
        if (distY > (rect.h / 2 + circle.radius)) return false;
        if (distX <= (rect.w / 2)) return true;
        if (distY <= (rect.h / 2)) return true;
        const dx = distX - rect.w / 2;
        const dy = distY - rect.h / 2;
        return (dx * dx + dy * dy <= (circle.radius * circle.radius));
    }

    function update() {
        if (!state.engineActive || state.gameOver) return;

        // 白色圓點前進軌跡更新
        const dx = mouseX - player.x;
        const dy = mouseY - player.y;
        player.angle = Math.atan2(dy, dx);
        
        const nextX = player.x + Math.cos(player.angle) * player.speed;
        const nextY = player.y + Math.sin(player.angle) * player.speed;
        
        let collides = false;
        walls.forEach(w => {
            if (checkCollision({x: nextX, y: nextY, radius: player.radius}, w)) collides = true;
        });
        
        if (!collides) {
            player.x = nextX;
            player.y = nextY;
        }

        if (state.pfc_energy < 100) state.pfc_energy = Math.min(100, state.pfc_energy + 0.22);

        waves.forEach((w) => {
            w.x += w.vx;
            w.y += w.vy;
            w.life--;

            walls.forEach(wall => {
                if (w.x >= wall.x && w.x <= wall.x + wall.w && w.y >= wall.y && w.y <= wall.y + wall.h) {
                    discoveredPoints.push({x: w.x, y: w.y, type: w.waveType, alpha: 1.0});
                    w.life = 0; 
                }
            });

            if (monster.active === false && Math.hypot(w.x - monster.x, w.y - monster.y) < monster.radius) {
                monster.active = true;
                state.monster_alert = true;
                document.getElementById("alert-box").style.display = "block";
                document.getElementById("ui-threat").innerText = "🚨 PURSUING";
                document.getElementById("ui-threat").style.color = "#ff0055";
            }
        });
        waves = waves.filter(w => w.life > 0);

        if (monster.active) {
            const mdx = player.x - monster.x;
            const mdy = player.y - monster.y;
            const mAngle = Math.atan2(mdy, mdx);
            monster.x += Math.cos(mAngle) * monster.speed;
            monster.y += Math.sin(mAngle) * monster.speed;

            if (Math.hypot(player.x - monster.x, player.y - monster.y) < player.radius + monster.radius) {
                state.gameOver = true;
                state.win = false;
            }
        }

        if (Math.hypot(player.x - escapePoint.x, player.y - escapePoint.y) < escapePoint.radius) {
            state.gameOver = true;
            state.win = true;
        }

        // 殘影自動衰減 (Generative Model Sensory Decay)
        discoveredPoints.forEach(p => p.alpha -= 0.0035);
        discoveredPoints = discoveredPoints.filter(p => p.alpha > 0);

        // 即時面板數值渲染
        const degreeAngle = Math.round((player.angle * 180 / Math.PI + 360) % 360);
        document.getElementById("ui-angle").innerText = `${degreeAngle}°`;
        document.getElementById("ui-energy").innerText = `${Math.round(state.pfc_energy)}%`;
        
const currentProgress = Math.min(100, Math.round((Math.hypot(player.x - 100, player.y - 100) / 940) * 100));
document.getElementById("val-progress").innerText = ${currentProgress}%;
}
function draw() {
ctx.fillStyle = "#050508";
ctx.fillRect(0, 0, canvas.width, canvas.height);
// 1. 渲染雷達記憶殘影
discoveredPoints.forEach(p => {
ctx.fillStyle = p.type === "high" ? rgba(0, 136, 255, ${p.alpha}) : rgba(255, 0, 110, ${p.alpha});
ctx.fillRect(p.x, p.y, 2, 2);
});
// 2. 渲染擴散粒子
waves.forEach(w => {
const alpha = w.life / w.maxLife;
ctx.fillStyle = ${w.color}${alpha});
ctx.fillRect(w.x, w.y, 2, 2);
});
// 3. 渲染白色發光主點
ctx.beginPath();
ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
ctx.fillStyle = "#ffffff";
ctx.shadowBlur = 12;
ctx.shadowColor = "#ffffff";
ctx.fill();
ctx.shadowBlur = 0;
// 雷達引導線
ctx.beginPath();
ctx.moveTo(player.x, player.y);
ctx.lineTo(player.x + Math.cos(player.angle) * 20, player.y + Math.sin(player.angle) * 20);
ctx.strokeStyle = "rgba(0, 255, 102, 0.5)";
ctx.lineWidth = 1.5;
ctx.stroke();
// 4. 渲染怪物的反向共振波
if (monster.active) {
waves.forEach(w => {
if (Math.hypot(w.x - monster.x, w.y - monster.y) < 55) {
ctx.beginPath();
ctx.arc(monster.x, monster.y, monster.radius + 20 * Math.random(), 0, Math.PI * 2);
ctx.strokeStyle = rgba(255, 0, 85, ${w.life / w.maxLife});
ctx.stroke();
}
});
}
// 結算畫面
if (state.gameOver) {
ctx.fillStyle = "rgba(3, 3, 5, 0.92)";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.font = "22px Courier New";
ctx.textAlign = "center";
ctx.shadowBlur = 10;
if (state.win) {
ctx.fillStyle = "#00ff66";
ctx.shadowColor = "#00ff66";
ctx.fillText("👑 認知模型重構成功：成功逃脫迷宮 👑", canvas.width / 2, canvas.height / 2);
} else {
ctx.fillStyle = "#ff0055";
ctx.shadowColor = "#ff0055";
ctx.fillText("🛑 預測加工崩潰：你被回聲獵手捕獲 🛑", canvas.width / 2, canvas.height / 2);
}
ctx.shadowBlur = 0;
}
}
function runSystemLoop() {
update();
draw();
requestAnimationFrame(runSystemLoop);
}
runSystemLoop();
